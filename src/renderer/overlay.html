<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LiquidPrivacy Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      user-select: none;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: transparent;
      pointer-events: auto; /* Allows mousemove events to register */
    }
  </style>
</head>
<body>
  <canvas id="overlay-canvas"></canvas>
  <script src="../../dist/renderer/overlay.js"></script>
</body>
</html>
